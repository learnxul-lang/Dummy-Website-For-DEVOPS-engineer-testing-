name: Release Verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-state:
    name: Verify production release state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect application version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -Eo 'Version[[:space:]]+[0-9]+\.[0-9]+' index.html | head -n1 || true)"
          echo "Detected: ${version:-no version string}"
          test -n "$version" || {
            echo "::error::No application version string was found in index.html."
            exit 1
          }
      - name: Confirm required feature exists on production
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi 'Version[[:space:]]+1\.1' index.html; then
            grep -Eqi 'System[[:space:]]+Status' index.html
            grep -Eqi 'Application[[:space:]]+operational' index.html
            echo "Version 1.1 contains the required assessment feature."
          else
            echo "Production is still pre-release (Version 1.1 not yet present)."
          fi
